server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same origin for the page and the API, so the browser needs no address or CORS setting.
    location /api/ {
        proxy_pass http://shop-api:5080;
    }

    location / {
        try_files $uri /index.html;
    }
}
