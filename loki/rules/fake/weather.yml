groups:
  - name: weather-logs
    rules:
      - alert: WeatherApiErrorLogs
        expr: sum(count_over_time({compose_service="weather-api"} |~ "(?i)(error|exception|fatal)" [5m])) > 5
        for: 0m
        labels:
          severity: warning
          service: weather
        annotations:
          summary: The weather API logs errors
          description: "More than 5 error lines in the API log in 5 minutes."
