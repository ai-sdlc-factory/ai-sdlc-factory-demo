# Every alert goes to the alert intake, which decides (with fixed rules) whether it becomes a ticket.
route:
  receiver: alert-intake
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 12h

receivers:
  - name: alert-intake
    webhook_configs:
      - url: http://alert-intake:8000/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/intake-token
