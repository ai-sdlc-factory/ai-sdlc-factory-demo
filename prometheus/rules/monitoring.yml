# Alerts about the monitoring itself. Their label `service: monitoring` matches no route of the alert intake, so they do NOT open tickets:
# they show in Alertmanager, in Prometheus and on the Grafana Overview dashboard.
groups:
  - name: monitoring
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: A part of the monitoring stopped answering
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})."

      - alert: AlertIntakeFailing
        expr: increase(alert_intake_outcomes_total{action="failed"}[10m]) > 0
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: The alert intake could not turn an alert into a ticket
          description: "The git host did not accept a ticket or a comment. Alertmanager sends the notification again; see the alert-intake log."

      - alert: AlertIntakeRateLimited
        expr: increase(alert_intake_outcomes_total{action="rate_limited"}[1h]) > 0
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: The alert intake holds back tickets
          description: "More alerts arrived than the limit of new tickets per hour allows. Something may be flapping."

      - alert: AlertIntakeRefusingNotifications
        expr: increase(alert_intake_rejected_total{reason="unauthorized"}[10m]) > 0
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: The alert intake refuses notifications
          description: "A notification arrived with the wrong token. Alertmanager and the intake must share the same secret (run ./setup.sh again)."
